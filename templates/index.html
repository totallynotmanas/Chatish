<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatish 💬</title>
    <style>
        :root { --bg: #0f1720; --panel: #111827; --accent: #61dafb; --hover: #1a202c; }
        * { box-sizing: border-box; }
        body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: #e6edf3; margin: 0; height: 100vh; display:flex; align-items:center; justify-content:center; }
        
        .container { width: 900px; height: 600px; background: var(--panel); border-radius: 12px; padding: 0; box-shadow: 0 8px 30px rgba(2,6,23,0.6); display: flex; flex-direction: column; }
        
        h1 { margin: 0; padding: 12px 16px; color: var(--accent); font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }
        
        /* Login/OTP screens */
        .auth-screen { align-items: center; justify-content: center; }
        .auth-form { width: 320px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; opacity: 0.8; }
        input[type=text], input[type=password] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: inherit; font-size: 14px; }
        input[type=text]:focus, input[type=password]:focus { outline: none; border-color: var(--accent); }
        
        button { padding: 10px 16px; border-radius: 8px; background: var(--accent); border: none; color: #001; font-weight: 600; cursor: pointer; font-size: 14px; width: 100%; }
        button:hover { opacity: 0.9; }
        
        .status { margin-top: 8px; font-size: 12px; opacity: 0.8; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        
        /* Chat screen layout */
        #chatScreen { flex-direction: row; }
        .sidebar { width: 280px; border-right: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; overflow: hidden; }
        .main-chat { flex: 1; display: flex; flex-direction: column; }
        
        .rooms-header { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; font-weight: 600; color: var(--accent); }
        .rooms-list { flex: 1; overflow-y: auto; }
        .room-item { padding: 12px 16px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.2s; }
        .room-item:hover { background: var(--hover); }
        .room-item.active { background: var(--hover); border-left-color: var(--accent); }
        .room-item-name { font-weight: 500; font-size: 14px; }
        .room-item-status { font-size: 11px; opacity: 0.6; margin-top: 2px; }
        
        .chat-header { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; justify-content: space-between; align-items: center; }
        .room-title { font-weight: 600; }
        
        #messages { flex: 1; overflow-y: auto; padding: 12px 16px; }
        .msg { margin: 8px 0; font-size: 14px; line-height: 1.4; }
        .msg-user { color: var(--accent); font-weight: 500; }
        .msg-content { color: #e6edf3; }
        .msg-system { color: #888; font-style: italic; font-size: 12px; margin: 4px 0; }
        
        .chat-input { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.04); display: flex; gap: 8px; }
        #text { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: inherit; font-size: 14px; }
        #text:focus { outline: none; border-color: var(--accent); }
        #send { width: auto; padding: 10px 20px; }
        
        .status { padding: 0 16px; font-size: 11px; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chatish 💬</h1>
        
        <!-- Login Screen -->
        <div id="loginScreen" class="screen auth-screen active">
            <div class="auth-form">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="font-size: 32px; margin-bottom: 8px;">💬</div>
                    <div style="font-size: 14px; opacity: 0.8;">Sign in to Chatish</div>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input id="username" type="text" placeholder="e.g., alice" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input id="password" type="password" placeholder="••••••••" />
                </div>
                <button id="loginBtn">Login</button>
                <div class="status" id="loginStatus"></div>
                <div style="margin-top: 16px; font-size: 12px; opacity: 0.6; text-align: center;">
                    Try: alice/password123, bob/secure456, or charlie/guest789
                </div>
            </div>
        </div>

        <!-- OTP Screen -->
        <div id="otpScreen" class="screen auth-screen">
            <div class="auth-form">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="font-size: 32px; margin-bottom: 8px;">🔐</div>
                    <div style="font-size: 14px; opacity: 0.8;">Enter verification code</div>
                </div>
                <p style="margin: 0 0 16px 0; font-size: 13px; color: #888;">Check the server console for your 6-digit OTP</p>
                <div class="form-group">
                    <label>6-digit OTP</label>
                    <input id="otp" type="text" placeholder="000000" maxlength="6" />
                </div>
                <button id="otpBtn">Verify</button>
                <div class="status" id="otpStatus"></div>
            </div>
        </div>

        <!-- Chat Screen -->
        <div id="chatScreen" class="screen">
            <!-- Sidebar with room list -->
            <div class="sidebar">
                <div class="rooms-header">Rooms</div>
                <div class="rooms-list" id="roomsList"></div>
                <div style="padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.04); font-size: 11px;">
                    <div id="welcomeMsg" style="opacity: 0.8;"></div>
                </div>
            </div>

            <!-- Main chat area -->
            <div class="main-chat">
                <div class="chat-header">
                    <div class="room-title" id="currentRoomTitle">Select a room</div>
                    <div style="font-size: 12px; opacity: 0.6; color: #51cf66;">●</div>
                </div>
                <div id="messages"></div>
                <div class="chat-input">
                    <input id="text" type="text" placeholder="Type a message..." />
                    <button id="send">Send</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
