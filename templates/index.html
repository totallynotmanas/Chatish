<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatish 💬</title>
    <style>
        :root { --bg: #0f1720; --panel: #111827; --accent: #61dafb; }
        body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: #e6edf3; margin: 0; height: 100vh; display:flex; align-items:center; justify-content:center; }
        .container { width: 420px; background: var(--panel); border-radius: 12px; padding: 18px; box-shadow: 0 8px 30px rgba(2,6,23,0.6); }
        h1 { margin: 0 0 8px 0; color: var(--accent); font-size: 20px }
        #messages { height: 300px; overflow:auto; background:#0b1116; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.03); }
        .msg { margin:6px 0; font-size:14px }
        .meta { opacity:0.65; font-size:12px }
        .inputRow { display:flex; gap:8px; margin-top:12px }
        input[type=text] { flex:1; padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:inherit }
        button { padding:8px 12px; border-radius:8px; background:var(--accent); border:none; color:#001; font-weight:600 }
        .status { margin-top:8px; font-size:12px; opacity:0.8 }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chatish 💬</h1>
        <div id="messages"></div>
        <div class="inputRow">
            <input id="name" type="text" placeholder="Your name" />
            <input id="text" type="text" placeholder="Type a message" />
            <button id="send">Send</button>
        </div>
        <div class="status" id="status">Connecting…</div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
